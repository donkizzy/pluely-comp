[package]
name = "pluely"
version = "0.1.9"
description = "The Open Source Alternative to Cluely - A lightning-fast, privacy-first AI assistant that works seamlessly during meetings, interviews, and conversations without anyone knowing."
authors = ["Srikanth Nani <srikanthnani1202@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/iamsrikanthnani/pluely"
homepage = "https://github.com/iamsrikanthnani/pluely"
documentation = "https://github.com/iamsrikanthnani/pluely/wiki"
readme = "../README.md"
keywords = ["ai-assistant", "tauri", "desktop-app", "privacy-first", "meeting-assistant"]
categories = ["gui", "multimedia", "accessibility", "science", "development-tools"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pluely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
dotenvy = "0.15.7"

[dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-http = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = "0.25.10"
xcap = "0.9.8"
base64 = "0.23.1"
hound = "3.5.1"
tokio = { version = "1.54.1", features = ["full"] }
once_cell = "1.21.4"
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.13.5", features = ["json", "stream", "multipart"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
anyhow = "1.0.104"
tracing = "0.1.44"
ringbuf = "0.6.0"
tauri-plugin-shell = "2.6.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-machine-uid = "0.1.3"
# track A: live audio
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2.3.0"
cidre = "0.29.0"
tauri-nspanel = "2.1.1"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.26.0"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.7.0"
